name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild of main without the layer cache, so fixes in the base image and OS
  # packages land even when the code has not changed. Servers get them on their next pull.
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags, so a deployment can pin an image and roll back:
      #   <sha>                   the commit's first build. The weekly rebuild does NOT overwrite it,
      #                           so a pin on a sha always gives the same image.
      #   <yyyymmdd>-<run>-<sha7> every build, including the weekly rebuild: unique (run number) and
      #                           sortable. Pin this one to pick up base image and OS package fixes.
      #   latest                  newest build.
      - id: tags
        env:
          IMG: ghcr.io/${{ github.repository }}
        run: |
          build="$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          {
            echo "list<<EOF"
            echo "$IMG:latest"
            echo "$IMG:$build"
            [[ "$GITHUB_EVENT_NAME" == schedule ]] || echo "$IMG:$GITHUB_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Image tag: \`$build\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          labels: |
            org.opencontainers.image.source=https://github.com/borgels/mcp-server-lager
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.tags.outputs.list }}
