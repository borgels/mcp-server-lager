name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild of main without the layer cache, so fixes in the base image and OS
  # packages land even when the code has not changed. Servers get them on their next pull.
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          labels: |
            org.opencontainers.image.source=https://github.com/borgels/mcp-server-lager
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
